<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="media/logo.svg" />
    <title>Kitchen Circle – cook together, eat all week</title>
    <meta name="description" content="A free weekly cook-together for international students who just arrived in Melbourne, led by a senior student from home. Student prototype." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="media/hero-poster.jpg" />
    <script src="https://cdn.tailwindcss.com/3.4.14"></script>
    <script>tailwind.config = { theme: {
  extend: {
    keyframes: {
      'fade-in-down': {
        '0%': { opacity: '0', transform: 'translateY(-8px)' },
        '100%': { opacity: '1', transform: 'translateY(0)' },
      },
      'slow-drift': {
        '0%': { transform: 'scale(1) translateY(0)' },
        '100%': { transform: 'scale(1.06) translateY(-1.5%)' },
      },
    },
    animation: {
      'fade-in-down': 'fade-in-down 0.2s ease-out',
      'slow-drift': 'slow-drift 14s ease-in-out infinite alternate',
    },
  },
} };</script>
    <script type="importmap">{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react"
  }
}</script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This page needs JavaScript. The original prototype page is at https://w200010190013-design.github.io/kitchen-circle/</noscript>
    <script type="module">
      // Mini loader: fetch each .tsx file, point its relative imports at the already-compiled modules,
      // compile it with Babel (TypeScript + React automatic runtime) and import it as a blob module.
      const SOURCES = ["src/lib/sheet.ts", "src/components/Navbar.tsx", "src/components/AboutSection.tsx", "src/components/FeaturesSection.tsx", "src/components/ReserveSection.tsx", "src/components/MentorSection.tsx", "src/App.tsx", "src/main.tsx"];
      try {
      const css = await (await fetch('src/index.css')).text();
      const style = document.createElement('style');
      style.textContent = css.replace(/^@tailwind[^;]*;\s*$/gm, '');
      document.head.appendChild(style);
      const compiled = {};
      const resolve = (from, spec) => {
        const parts = from.split('/').slice(0, -1);
        for (const seg of spec.split('/')) {
          if (seg === '..') parts.pop(); else if (seg !== '.') parts.push(seg);
        }
        const path = parts.join('/');
        if (/\.tsx?$/.test(path)) return path;
        return SOURCES.includes(path + '.tsx') ? path + '.tsx' : path + '.ts';
      };
      for (const file of SOURCES) {
        let code = await (await fetch(file)).text();
        code = code.replace(/^import\s+['"][^'"]+\.css['"];?\s*$/gm, '');
        code = code.replace(/(from\s+)(['"])(\.{1,2}\/[^'"]+)\2/g, (m, pre, q, spec) => {
          const target = resolve(file, spec);
          if (!compiled[target]) throw new Error(file + ' imports ' + target + ' before it is compiled (check SOURCES order)');
          return pre + q + compiled[target] + q;
        });
        const out = Babel.transform(code, {
          filename: file,
          presets: [['typescript', { isTSX: true, allExtensions: true }], ['react', { runtime: 'automatic' }]],
        }).code;
        compiled[file] = URL.createObjectURL(new Blob([out], { type: 'text/javascript' }));
      }
      await import(compiled['src/main.tsx']);
      } catch (e) {
        document.getElementById('root').textContent = 'Could not load the page: ' + e.message;
        throw e;
      }
    </script>
  </body>
</html>
